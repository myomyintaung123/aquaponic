<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Singa-Ponics Menu</title>
  <link rel="stylesheet" href="css/variable.css">
  <link rel="stylesheet" href="css/style.css">

  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- HTML to Image Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <img 
      src="images/singaponics.png" 
      alt="Singa-Ponics Logo" 
      id="brand-logo" 
      onclick="handleLogoClick()" 
      class="brand-logo-img"
      style="cursor: pointer; height: 40px; width: auto; object-fit: contain;"
    />
    <div class="header-controls">
      <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()" aria-label="Toggle Theme">🌙</button>
      <button id="nav-customer" onclick="switchView('customer')" class="btn-nav hidden">Menu</button>
      <button id="nav-admin" onclick="switchView('admin')" class="btn-nav hidden">Admin (<span id="admin-count">0</span>)</button>
    </div>
  </header>

  <!-- ================= CUSTOMER VIEW ================= -->
  <main id="customer-view" class="main-container">
    <div class="shop-banner">
      <h2>Scan & Order</h2>
      <p style="font-size: 0.8rem; opacity: 0.9;">No login required</p>
      <div class="table-badge">📍 Table 05</div>
    </div>

    <!-- Customer Name Input -->
    <div style="margin-bottom: 15px; padding: 0 5px;">
      <label for="customer-name-input" style="display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px;">Your Name:</label>
      <input type="text" id="customer-name-input" placeholder="Enter your name..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main);">
    </div>

    <!-- Menu Container -->
    <div id="menu-container"></div>

    <!-- Order Summary Slip Modal -->
    <div id="order-slip-modal" class="modal-overlay hidden">
      <div class="order-slip">
        <div id="slip-content-to-capture" style="background: var(--bg-card); padding: 15px; border-radius: 12px;">
          <h3 style="color: var(--primary-color);">✓ Order Confirmed</h3>
          <p id="slip-order-id" style="color: var(--text-muted); font-size: 0.85rem;"></p>
          <p id="slip-customer-name" style="font-weight: bold; font-size: 0.9rem; margin-top: 4px;"></p>
          
          <div class="slip-box">
            <h4>Order Summary:</h4>
            <div id="slip-items"></div>
            <div class="slip-row slip-total">
              <span>Total:</span>
              <span id="slip-total-price" style="color: var(--primary-color);">$0.00</span>
            </div>
          </div>

          <div style="margin-top: 15px; padding: 10px; background: rgba(16, 185, 129, 0.1); border-radius: 8px; text-align: center;">
            <p style="font-size: 0.85rem; color: var(--primary-color); font-weight: bold;">Please show this receipt when collecting your items.</p>
          </div>
        </div>

        <div style="display: flex; gap: 8px; margin-top: 15px;">
          <button onclick="saveCustomerSlipImage()" class="btn-order" style="width: 100%; background: #10b981;">💾 Save Receipt & Back to Menu</button>
        </div>
      </div>
    </div>

    <!-- Bottom Fixed Cart Bar -->
    <div id="cart-bar" class="cart-bar hidden">
      <div>
        <p id="cart-count-text" style="font-size: 0.8rem; color: var(--text-muted);">0 Selected</p>
        <p id="cart-total-text" style="font-size: 1.2rem; font-weight: bold;"></p>
      </div>
      <div style="display: flex; gap: 8px;">
        <button onclick="clearCart()" class="btn-nav" style="background: #ef4444; color: #fff;">Clear</button>
        <button onclick="submitOrder()" class="btn-order">Place Order</button>
      </div>
    </div>
  </main>

  <!-- ================= ADMIN VIEW ================= -->
  <main id="admin-view" class="admin-container hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>Kitchen Live Orders</h2>
      <button onclick="logoutAdmin()" class="btn-add" style="background: #ef4444;">Exit Admin</button>
    </div>
    
    <div id="admin-orders-container" class="admin-grid"></div>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid var(--border-color);">

    <!-- Admin Stock Management -->
    <h2>Product Inventory Management</h2>
    <div id="admin-inventory-container" style="margin-top: 15px;"></div>
  </main>

  <!-- Product Info Modal -->
  <div id="product-info-modal" class="modal-overlay hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 250;">
    <div class="slip-box" style="background: var(--bg-card); max-width: 320px; width: 100%; margin: 0; text-align: center;">
      <h3 id="info-modal-title">Product Info</h3>
      <p id="info-modal-desc" style="font-size: 0.9rem; color: var(--text-main); margin: 15px 0;"></p>
      <button onclick="closeProductInfoModal()" class="btn-order" style="width: 100%;">Close</button>
    </div>
  </div>

  <!-- Secret Admin Password Modal -->
  <div id="admin-pass-modal" class="modal-overlay hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 200;">
    <div class="slip-box" style="background: var(--bg-card); max-width: 320px; width: 100%; margin: 0; text-align: center;">
      <h3>Admin Access</h3>
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px;">Enter Admin PIN code</p>
      
      <!-- Wrapped inside a form -->
      <form onsubmit="event.preventDefault(); verifyAdminPin();">
        <input type="password" id="admin-pin-input" autocomplete="current-password" placeholder="PIN" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); text-align: center; margin-bottom: 12px;">
        <div style="display: flex; gap: 8px;">
          <button type="button" onclick="closeAdminPassModal()" class="btn-nav" style="flex: 1;">Cancel</button>
          <button type="submit" class="btn-order" style="flex: 1; padding: 8px;">Login</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script type="module" src="js/script.js?v=4"></script>
</body>
</html>
